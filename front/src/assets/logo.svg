<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="家政服务">
  <title>家政服务</title>
  <defs>
    <linearGradient id="hsBadge" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFF3EA"/>
    </linearGradient>
    <linearGradient id="hsHouse" x1="10" y1="10" x2="54" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFAE72"/>
      <stop offset=".5" stop-color="#FF7A45"/>
      <stop offset="1" stop-color="#EE5A1E"/>
    </linearGradient>
  </defs>

  <!-- 圆角底板 -->
  <rect x="1" y="1" width="62" height="62" rx="18" fill="url(#hsBadge)"/>
  <rect x="1" y="1" width="62" height="62" rx="18" fill="none" stroke="#FFE0CD" stroke-width="1.5"/>

  <!-- 屋顶 + 墙体（同一渐变，无接缝） -->
  <path d="M32 10.8 L54.2 31.4 H9.8 Z"
        fill="url(#hsHouse)" stroke="url(#hsHouse)" stroke-width="3" stroke-linejoin="round"/>
  <rect x="15.2" y="28.6" width="33.6" height="25" rx="4.5" fill="url(#hsHouse)"/>

  <!-- 心形：用心服务、守护每一个家 -->
  <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"
        transform="translate(23.36 32.24) scale(0.72)" fill="#FFFFFF"/>

  <!-- 闪亮星：洁净感 -->
  <path d="M51.5 7.5 L53.18 11.82 L57.5 13.5 L53.18 15.18 L51.5 19.5 L49.82 15.18 L45.5 13.5 L49.82 11.82 Z" fill="#FFB176"/>
  <path d="M13.5 15 L14.62 17.88 L17.5 19 L14.62 20.12 L13.5 23 L12.38 20.12 L9.5 19 L12.38 17.88 Z" fill="#FFCBAA"/>
</svg>
